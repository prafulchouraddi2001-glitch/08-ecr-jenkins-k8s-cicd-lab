apiVersion: apps/v1
kind: Deployment
metadata:
  name: project8-cicd
  namespace: project8-cicd
  labels:
    app: project8-cicd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project8-cicd
  template:
    metadata:
      labels:
        app: project8-cicd
    spec:
      containers:
        - name: app
          image: 258167965211.dkr.ecr.ap-south-1.amazonaws.com/project8-cicd-lab:1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
